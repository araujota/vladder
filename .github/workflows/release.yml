name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit source tree
        run: python scripts/audit_release.py --root .
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang llvm z3
      - name: Install Zig and Julia adapter toolchains
        run: |
          scripts/bootstrap_language_toolchains.sh --prefix "${RUNNER_TEMP}/vladder-language-tools"
          echo "${RUNNER_TEMP}/vladder-language-tools/bin" >> "${GITHUB_PATH}"
      - run: python -m pip install --upgrade pip '.[dev]'
      - name: Validate tag identity
        id: identity
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: python -m pytest -q
      - name: Validate skill and executable grammar
        run: |
          vladder skill validate
          vladder lower validate
          vladder deep coverage
      - name: Validate lifetime workflow
        run: |
          vladder lifetime evaluate-corpus \
            --manifest examples/lifetime/lifetime_corpus.yaml \
            --trace examples/lifetime/lifetime_trace.json \
            --out-dir /tmp/vladder-lifetime-evaluation
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/audit_release.py --artifact dist/*.whl --artifact dist/*.tar.gz
          python scripts/release_preflight.py --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --require-artifacts
      - name: Render Homebrew formula
        run: |
          python scripts/render_homebrew_formula.py \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${{ steps.identity.outputs.version }}" \
            --source-path "dist/vladder-${{ steps.identity.outputs.version }}.tar.gz" \
            --output release/vladder.rb
          ruby -c release/vladder.rb
      - name: Generate checksums
        run: (cd dist && sha256sum *) > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-extras
          path: release/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-extras
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          if [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* release/* \
            --verify-tag --generate-notes --title "vLadder ${VERSION}" "${flags[@]}"

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  homebrew:
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    needs: [build, github-release]
    runs-on: ubuntu-24.04
    environment: homebrew
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-extras
          path: release
      - name: Update tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh repo clone "${TAP_REPOSITORY}" tap
          mkdir -p tap/Formula
          cp release/vladder.rb tap/Formula/vladder.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/vladder.rb; then exit 0; fi
          git add Formula/vladder.rb
          git commit -m "vladder ${VERSION}"
          git push
