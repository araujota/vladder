name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/release-site/package-lock.json
            services/review-backend/package-lock.json
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang glslang-tools llvm spirv-tools z3
      - name: Install Zig and Julia adapter toolchains
        run: |
          scripts/bootstrap_language_toolchains.sh --prefix "${RUNNER_TEMP}/vladder-language-tools"
          echo "${RUNNER_TEMP}/vladder-language-tools/bin" >> "${GITHUB_PATH}"
      - run: python -m pip install --upgrade pip '.[dev]'
      - run: npm ci --prefix apps/release-site
      - run: npm ci --prefix services/review-backend
      - run: npm install --global @fission-ai/openspec@1.7.0
      # Online channel controls are verified before tagging. The ephemeral
      # GITHUB_TOKEN cannot read branch-protection or environment admin APIs.
      - name: Executable release-candidate gate
        run: >-
          python scripts/release_readiness.py --execute
          --require-target release_candidate --out build/release-readiness.json
      - name: Production contribution endpoint contract
        run: |
          python - <<'PY'
          import json
          from vladder.contribution_transport import (
              DEFAULT_CONTRIBUTION_BASE,
              verify_contribution_service_contract,
          )

          report = verify_contribution_service_contract(
              DEFAULT_CONTRIBUTION_BASE,
              timeout_seconds=20,
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Production canonical-search release evidence
        run: |
          python scripts/validate_production_search_qualification.py
          python -m pytest -q \
            tests/test_canonical_state_search.py \
            tests/test_production_canonical_search.py \
            tests/test_production_canonical_smoke.py
          vladder release smoke-canonical-search \
            --out build/production-canonical-search-smoke.json
          vladder release canonical-search-evidence \
            > build/packaged-canonical-search-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness
          path: |
            build/release-readiness.json
            build/production-canonical-search-smoke.json
            build/packaged-canonical-search-evidence.json
          if-no-files-found: error

  build:
    needs: readiness
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit source tree
        run: python scripts/audit_release.py --root .
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang glslang-tools llvm spirv-tools z3
      - name: Install Zig and Julia adapter toolchains
        run: |
          scripts/bootstrap_language_toolchains.sh --prefix "${RUNNER_TEMP}/vladder-language-tools"
          echo "${RUNNER_TEMP}/vladder-language-tools/bin" >> "${GITHUB_PATH}"
      - run: python -m pip install --upgrade pip '.[dev]'
      - name: Validate tag identity
        id: identity
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: python -m pytest -q
      - name: Validate skill and executable grammar
        run: |
          vladder skill validate
          vladder lower validate
          vladder deep coverage
      - name: Validate lifetime workflow
        run: |
          vladder lifetime evaluate-corpus \
            --manifest examples/lifetime/lifetime_corpus.yaml \
            --trace examples/lifetime/lifetime_trace.json \
            --out-dir /tmp/vladder-lifetime-evaluation
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/audit_release.py --artifact dist/*.whl --artifact dist/*.tar.gz
          python scripts/release_preflight.py --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --require-artifacts
          python -m pip install --force-reinstall --no-deps dist/*.whl
          (cd /tmp && vladder release canonical-search-evidence >vladder-packaged-search-evidence.json)
      - name: Render Homebrew formula
        run: |
          python scripts/render_homebrew_formula.py \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${{ steps.identity.outputs.version }}" \
            --source-path "dist/vladder-${{ steps.identity.outputs.version }}.tar.gz" \
            --output release/vladder.rb
          ruby -c release/vladder.rb
      - name: Generate checksums
        run: (cd dist && sha256sum *) > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-extras
          path: release/
          if-no-files-found: error

  homebrew-verify:
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-extras
          path: release
      - name: Audit formula structure
        run: brew audit --strict --formula release/vladder.rb
      - name: Install formula from the exact local release source
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source_path="$(pwd)/dist/vladder-${VERSION}.tar.gz"
          python3 - "${source_path}" release/vladder.rb release/vladder.rb <<'PY'
          from pathlib import Path
          import sys
          source, original, output = sys.argv[1:]
          text = Path(original).read_text()
          lines = text.splitlines()
          lines[next(i for i, line in enumerate(lines) if line.strip().startswith('url '))] = f'  url "file://{source}"'
          Path(output).write_text("\n".join(lines) + "\n")
          PY
          brew install --build-from-source --formula ./release/vladder.rb
          brew test vladder
  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-extras
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          if [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* release/* \
            --verify-tag --generate-notes --title "vLadder ${VERSION}" "${flags[@]}"

  pypi:
    needs: [build, github-release]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/vladder
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish distributions to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@release/v1

  homebrew:
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
    needs: [build, github-release, homebrew-verify]
    runs-on: macos-15
    environment: homebrew
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-extras
          path: release
      - name: Update tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          brew audit --strict --online --formula release/vladder.rb
          gh repo clone "${TAP_REPOSITORY}" tap
          mkdir -p tap/Formula
          cp release/vladder.rb tap/Formula/vladder.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/vladder.rb; then exit 0; fi
          git add Formula/vladder.rb
          git commit -m "vladder ${VERSION}"
          git push
