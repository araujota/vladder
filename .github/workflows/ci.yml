name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip '.[dev]'
      - name: Ruff correctness lint
        run: ruff check --output-format=github .
      - name: Bandit medium/high-confidence security scan
        run: bandit -r vladder scripts -ll -ii -x tests
      - name: Seeded accepted and rejected transformations
        run: python scripts/validate_release_seeds.py --out-dir /tmp/vladder-release-seeds

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang llvm z3
      - name: Install Zig and Julia adapter toolchains
        if: matrix.python-version == '3.12'
        run: |
          scripts/bootstrap_language_toolchains.sh --prefix "${RUNNER_TEMP}/vladder-language-tools"
          echo "${RUNNER_TEMP}/vladder-language-tools/bin" >> "${GITHUB_PATH}"
      - name: Install package
        run: python -m pip install --upgrade pip '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Validate skill and grammar
        run: |
          vladder skill validate
          vladder lower validate
          vladder deep coverage
      - name: Validate lifetime workflow
        run: |
          vladder lifetime evaluate-corpus \
            --manifest examples/lifetime/lifetime_corpus.yaml \
            --trace examples/lifetime/lifetime_trace.json \
            --out-dir /tmp/vladder-lifetime-evaluation
      - name: Run release demos
        if: matrix.python-version == '3.12'
        run: python scripts/run_release_demos.py --out-dir /tmp/vladder-release-demos

  install-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: One-command isolated install
        run: |
          scripts/install.sh --no-system-packages --without-alive2 --without-language-tools \
            --prefix "${RUNNER_TEMP}/vladder"
          "${RUNNER_TEMP}/vladder/bin/vladder" --version
          "${RUNNER_TEMP}/vladder/bin/vladder" schema list

  public-release-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/release-site/package-lock.json
            services/review-backend/package-lock.json
      - name: Install native proof tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang llvm z3
      - run: python -m pip install --upgrade pip '.[dev]'
      - run: npm ci --prefix apps/release-site
      - run: npm ci --prefix services/review-backend
      - name: Requirement-level release gate
        run: python scripts/public_release_gate.py --execute --out build/public-release-gate.json
      - uses: actions/upload-artifact@v5
        with:
          name: public-release-gate
          path: build/public-release-gate.json

  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit source tree
        run: python scripts/audit_release.py --root .
      - run: python -m pip install --upgrade pip '.[dev]'
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python scripts/audit_release.py --artifact dist/*.whl --artifact dist/*.tar.gz
          python scripts/release_preflight.py --require-artifacts
