name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang llvm z3
      - name: Install package
        run: python -m pip install --upgrade pip '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Validate skill and grammar
        run: |
          vladder skill validate
          vladder lower validate
      - name: Validate lifetime workflow
        run: |
          vladder lifetime evaluate-corpus \
            --manifest examples/lifetime/lifetime_corpus.yaml \
            --trace examples/lifetime/lifetime_trace.json \
            --out-dir /tmp/vladder-lifetime-evaluation

  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit source tree
        run: python scripts/audit_release.py --root .
      - run: python -m pip install --upgrade pip '.[dev]'
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python scripts/audit_release.py --artifact dist/*.whl --artifact dist/*.tar.gz
          python scripts/release_preflight.py --require-artifacts
