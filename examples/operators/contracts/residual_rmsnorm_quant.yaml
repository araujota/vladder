operator: residual_rmsnorm_quant
entrypoint: residual_rmsnorm_quant
language: c17
inputs:
  x: {element_type: f32, shape: [256], param_index: 0}
  residual: {element_type: f32, shape: [256], param_index: 1}
  weight: {element_type: f32, shape: [256], param_index: 2}
scratch:
  temporary: {element_type: f32, shape: [256], param_index: 3}
outputs:
  y: {element_type: f32, shape: [256], param_index: 4}
  q: {element_type: i8, shape: [256], param_index: 5}
  scale: {element_type: f32, shape: [1], param_index: 6}
state: {}
semantics:
  integer_overflow: forbidden
  floating_point:
    class: deterministic_tolerance
    max_abs: 0.00001
    max_rel: 0.00001
    max_drift: 0.0001
  nan_policy: forbidden_by_precondition
  infinity_policy: forbidden_by_precondition
  allocation: forbidden
  io: forbidden
  exceptions: none
distribution:
  generator: deterministic_adversarial_f32_v1
  train_seed: 101
  held_out_seed: 202
objective:
  primary: operator_latency_cycles
  secondary: [materialized_bytes, instructions]
constraints:
  max_code_growth_percent: 150
  max_stack_bytes: 4096
specializations:
  dimension_256: {value: 256, enforcement: guard}
graph:
  edge_defaults:
    element_type: f32
    shape: [256]
    stride: [1]
    alignment: 4
    alias_set: noalias_inputs_outputs
    mutability: immutable
    lifetime: operator
    memory_region: register
    ordering: data
    numerical_contract: deterministic_tolerance
  nodes:
    - {id: load_x, kind: LoadStream, attrs: {stream: x}}
    - {id: load_residual, kind: LoadStream, attrs: {stream: residual}}
    - {id: load_weight, kind: LoadStream, attrs: {stream: weight}}
    - {id: residual_add, kind: Zip, attrs: {op: fadd}}
    - {id: scratch, kind: Materialize, attrs: {layout_owner: operator}}
    - {id: sum_sq, kind: Reduce, attrs: {op: sum_squares, algebra: ordered_f32_sum}}
    - {id: scale, kind: Map, attrs: {op: reciprocal_sqrt}}
    - {id: normalize_weight, kind: Map, attrs: {op: mul_scale_weight}}
    - {id: quantize, kind: Pack, attrs: {format: symmetric_i8}}
    - {id: emit_y, kind: Emit, attrs: {output: y}}
    - {id: emit_q, kind: Emit, attrs: {output: q}}
    - {id: emit_scale, kind: Emit, attrs: {output: scale}}
  edges:
    - {src: load_x, dst: residual_add, memory_region: input}
    - {src: load_residual, dst: residual_add, memory_region: input}
    - {src: residual_add, dst: scratch, memory_region: temporary, mutability: mutable}
    - {src: scratch, dst: sum_sq, memory_region: temporary}
    - {src: sum_sq, dst: scale, shape: [1]}
    - {src: scratch, dst: normalize_weight, memory_region: temporary}
    - {src: load_weight, dst: normalize_weight, memory_region: input}
    - {src: scale, dst: normalize_weight, shape: [1]}
    - {src: normalize_weight, dst: quantize}
    - {src: normalize_weight, dst: emit_y, memory_region: output, mutability: writeonly}
    - {src: quantize, dst: emit_q, element_type: i8, memory_region: output, mutability: writeonly}
    - {src: scale, dst: emit_scale, shape: [1], memory_region: output, mutability: writeonly}
