operator: logit_penalty_greedy
entrypoint: logit_penalty_greedy
language: c17
inputs:
  logits: {element_type: f32, shape: [vocabulary], param_index: 0}
  repeated: {element_type: u8, shape: [vocabulary], param_index: 1}
outputs:
  adjusted: {element_type: f32, shape: [vocabulary], param_index: 2}
  token: {element_type: i32, shape: [1], param_index: 3}
semantics: {integer_overflow: forbidden, floating_point: {class: bitwise}, nan_policy: forbidden_by_precondition, infinity_policy: forbidden_by_precondition, allocation: forbidden, io: forbidden, exceptions: none}
distribution: {vocabulary_sizes: [32000, 128256], repeated_fraction: 0.02, sampling_seed_semantics: pcg64_per_step, train_seed: 131, held_out_seed: 132}
objective: {primary: operator_latency_cycles, secondary: [stream_bytes]}
constraints: {max_code_growth_percent: 100, max_stack_bytes: 4096}
specializations: {greedy: {value: true, enforcement: precondition}}
graph:
  edge_defaults: {element_type: f32, shape: [vocabulary], stride: [1], alignment: 4, alias_set: logit_regions, mutability: immutable, lifetime: token, memory_region: register, ordering: data, numerical_contract: bitwise}
  nodes:
    - {id: logits, kind: LoadStream, attrs: {stream: logits}}
    - {id: penalty, kind: Map, attrs: {op: repetition_penalty}}
    - {id: materialize, kind: Materialize, attrs: {layout_owner: operator}}
    - {id: argmax, kind: Reduce, attrs: {op: argmax, algebra: ordered}}
    - {id: emit_adjusted, kind: Emit, attrs: {output: adjusted}}
    - {id: emit_token, kind: Emit, attrs: {output: token}}
  edges:
    - {src: logits, dst: penalty, memory_region: input}
    - {src: penalty, dst: materialize, memory_region: temporary}
    - {src: materialize, dst: argmax}
    - {src: materialize, dst: emit_adjusted, memory_region: output, mutability: writeonly}
    - {src: argmax, dst: emit_token, shape: [1], element_type: i32, memory_region: output, mutability: writeonly}
