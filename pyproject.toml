[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vladder"
version = "1.0.0rc18"
description = "Verified hardware-aware information-flow superoptimization for systems languages"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "vLadder contributors"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["superoptimization", "LLVM", "Alive2", "Z3", "C", "C++", "Rust", "Zig", "Julia", "performance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Programming Language :: C++",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Compilers",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "z3-solver>=4.12,<5",
]

[project.urls]
Homepage = "https://github.com/araujota/vladder"
Repository = "https://github.com/araujota/vladder"
Issues = "https://github.com/araujota/vladder/issues"
Changelog = "https://github.com/araujota/vladder/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
  "tomli>=2,<3; python_version < '3.11'",
  "twine>=6,<7",
]

[project.scripts]
vladder = "vladder.cli:main"
silicontune = "vladder.cli:main"

[tool.setuptools.packages.find]
include = ["vladder*"]

[tool.setuptools.package-data]
vladder = [
  "grammars/**/*.json",
  "grammars/**/*.yaml",
  "reviews/**/*.md",
  "schemas/**/*.json",
  "skills/**/*.md",
  "skills/**/*.yaml",
  "native/*.cpp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["build", "dist", "third_party"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
